version: "2"
linters:
  enable:
    - errcheck
    - errorlint
    - gosec
    - nilnil
    - revive
    - staticcheck
    - unparam
  settings:
    gosec:
      excludes:
        - G103 # the ioctls in internal/hidraw need unsafe
        - G115 # byte protocols narrow integers on purpose
        - G304 # paths come from sysfs, udev directories or the user's own flags
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-naming
        - name: error-strings
        - name: errorf
        - name: var-naming
        - name: receiver-naming
        - name: unused-parameter
  exclusions:
    presets:
      - std-error-handling # unchecked Close and Fprint
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, unparam, revive]
